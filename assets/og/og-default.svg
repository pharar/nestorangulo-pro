<!-- OG default card — 1200×630 visual reference
     Actual rendering: node scripts/generate-og.js (Playwright/Chromium)
     The script builds an equivalent HTML template with real @font-face:
       - Fraunces Variable wght-italic (display, italic, w700, 68px)
       - IBM Plex Sans 400/500 (subtitle, 27px)
       - IBM Plex Mono 400 (domain, 21px)
     All fonts loaded from node_modules woff2 files; isotipo from public/images/.
     Target: public/og-default.png, < 200 KB, sRGB, 1200×630.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">

  <!-- Background -->
  <rect width="1200" height="630" fill="#faf9f7"/>

  <!-- Amber top accent bar -->
  <rect x="0" y="0" width="1200" height="7" fill="#c08c50"/>

  <!-- Name: Fraunces Variable, italic, weight 700, 68px -->
  <text
    x="80"
    y="248"
    font-family="'Fraunces Variable', Georgia, serif"
    font-size="68"
    font-weight="700"
    font-style="italic"
    fill="#1c1917"
    letter-spacing="-0.5"
  >Nestor Angulo de Ugarte</text>

  <!-- Subtitle: IBM Plex Sans 500, 27px -->
  <text
    x="80"
    y="305"
    font-family="'IBM Plex Sans', Arial, sans-serif"
    font-size="27"
    font-weight="500"
    fill="#6b6663"
    letter-spacing="0.1"
  >Head of Security · Security Program Builder · CISSP</text>

  <!-- Isotipo — composited by generate-og.js at right:68 top:240 width:130 -->

  <!-- Separator -->
  <line x1="80" y1="500" x2="1120" y2="500" stroke="#e8e4df" stroke-width="1.5"/>

  <!-- Domain: IBM Plex Mono 400, 21px -->
  <text
    x="80"
    y="548"
    font-family="'IBM Plex Mono', 'Courier New', monospace"
    font-size="21"
    font-weight="400"
    fill="#c08c50"
    letter-spacing="0.3"
  >nestorangulo.pro</text>

</svg>
