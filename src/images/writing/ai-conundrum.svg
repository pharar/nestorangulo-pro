<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
  <title id="t">The AI conundrum</title>
  <desc id="d">Two identical machines face each other across a city skyline. The one on the right has a small gold mark in its head: the pilot.</desc>
  <defs>
    <style>
      .ln { fill: none; stroke: #8a8580; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .ln-thin { fill: none; stroke: #8a8580; stroke-width: 1.5; stroke-linecap: round; opacity: .55; }
      .fill { fill: #8a8580; opacity: .12; }
      .gold { fill: #c08c50; }
      .gold-ln { fill: none; stroke: #c08c50; stroke-width: 2.5; stroke-linecap: round; }
      .lbl { font-family: 'IBM Plex Mono', 'Fira Code', monospace; font-size: 15px; letter-spacing: .06em; fill: #8a8580; }
      .lbl-gold { font-family: 'IBM Plex Mono', 'Fira Code', monospace; font-size: 15px; letter-spacing: .06em; fill: #c08c50; }
    </style>
    <!-- one machine, drawn once; the second is this one mirrored -->
    <g id="machine">
      <!-- head -->
      <rect class="ln" x="318" y="150" width="84" height="64" rx="8"/>
      <!-- visor -->
      <line class="ln" x1="334" y1="182" x2="386" y2="182"/>
      <!-- neck -->
      <line class="ln" x1="360" y1="214" x2="360" y2="232"/>
      <!-- torso -->
      <rect class="ln" x="296" y="232" width="128" height="120" rx="10"/>
      <!-- chest plate -->
      <path class="ln-thin" d="M320 262 H400 M320 286 H400"/>
      <!-- near arm (toward the city) -->
      <path class="ln" d="M424 252 H470 V330"/>
      <!-- far arm -->
      <path class="ln" d="M296 252 H250 V330"/>
      <!-- legs -->
      <path class="ln" d="M316 352 V430 M404 352 V430"/>
      <!-- feet -->
      <path class="ln" d="M296 430 H336 M384 430 H424"/>
    </g>
  </defs>

  <!-- ground -->
  <line class="ln" x1="80" y1="430" x2="1120" y2="430"/>

  <!-- skyline between the two -->
  <g class="fill">
    <rect x="500" y="340" width="30" height="90"/>
    <rect x="538" y="304" width="24" height="126"/>
    <rect x="570" y="356" width="38" height="74"/>
    <rect x="616" y="286" width="22" height="144"/>
    <rect x="646" y="326" width="32" height="104"/>
    <rect x="686" y="366" width="26" height="64"/>
  </g>
  <g class="ln-thin">
    <rect x="500" y="340" width="30" height="90"/>
    <rect x="538" y="304" width="24" height="126"/>
    <rect x="570" y="356" width="38" height="74"/>
    <rect x="616" y="286" width="22" height="144"/>
    <rect x="646" y="326" width="32" height="104"/>
    <rect x="686" y="366" width="26" height="64"/>
  </g>

  <!-- left machine -->
  <use href="#machine"/>
  <!-- right machine: the same drawing, mirrored -->
  <use href="#machine" transform="translate(1200 0) scale(-1 1)"/>

  <!-- the pilot: one gold point in the right head -->
  <circle class="gold" cx="840" cy="182" r="7"/>
  <line class="gold-ln" x1="847" y1="182" x2="950" y2="182" stroke-dasharray="4 7"/>
  <text class="lbl-gold" x="962" y="187">the pilot</text>

  <!-- equal-size marker -->
  <path class="ln-thin" d="M250 110 H470 M250 102 V118 M470 102 V118"/>
  <path class="ln-thin" d="M730 110 H950 M730 102 V118 M950 102 V118"/>
  <text class="lbl" x="360" y="92" text-anchor="middle">same size</text>
  <text class="lbl" x="840" y="92" text-anchor="middle">same size</text>

  <!-- caption -->
  <text class="lbl" x="600" y="488" text-anchor="middle">same tool · same capabilities · what differs is who is at the controls</text>
</svg>
