# Keeps dependencies and CI actions from drifting unnoticed.
# The four workflow actions had silently fallen a major version behind before
# this file existed, which is exactly what `github-actions` below prevents.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Astro's core and its integrations release together; one PR, not five.
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      dev-dependencies:
        dependency-type: development
    ignore:
      # TypeScript majors are held back by @astrojs/check, whose peer range is
      # `^5.0.0 || ^6.0.0` as of 0.9.10 — the latest published version, so there
      # is nothing to upgrade it to. TS 7 makes `astro check` exit 1 with no
      # diagnostics, which took down the whole Type check job in #25. The
      # `@astrojs/check` override in package.json pins it to the root TypeScript,
      # so resolution cannot route around it either.
      # Drop this entry once @astrojs/check declares support for TypeScript 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
