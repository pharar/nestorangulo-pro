# Keeps dependencies and CI actions from drifting unnoticed.
# The four workflow actions had silently fallen a major version behind before
# this file existed, which is exactly what `github-actions` below prevents.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Astro's core and its integrations release together; one PR, not five.
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      dev-dependencies:
        dependency-type: development
      # Security updates ignore the groups above unless a group opts in, so each
      # advisory in a transitive package used to open its own PR — six of them in
      # four weeks. One PR for all of them instead.
      security:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      # TypeScript majors are held back by the type checker, not by this site's
      # code. @astrojs/check's peer range is still `^5.0.0 || ^6.0.0` as of
      # 0.9.12, and on TypeScript 7.0 `astro check` now refuses to run at all —
      # an earlier attempt took down the whole Type check job in #25. The
      # `@astrojs/check` override in package.json pins it to the root TypeScript,
      # so resolution cannot route around it either.
      # Upstream's way out is not a wider peer range but TypeScript 7.1 content
      # mappers, which need 7.1 to be stable. `npm run housekeeping` reports when
      # that changes; documentation/HOUSEKEEPING.md has the migration. Drop this
      # entry as part of it.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
